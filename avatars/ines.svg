  <style>
    .bob { transform-origin: 160px 250px; animation: bob 4.2s ease-in-out infinite; animation-delay: -3.4s; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; animation-delay: -3.4s; }
    @keyframes bob { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2deg) translateY(-2px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .baby { transform-origin: 166px 300px; animation: rock 3.2s ease-in-out infinite; }
    @keyframes rock { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .bob, .blink, .baby { animation: none; } }
  </style>
