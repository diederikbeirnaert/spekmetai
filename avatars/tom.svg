  <style>
    .bob { transform-origin: 160px 250px; animation: bob 4.2s ease-in-out infinite; animation-delay: -1.7s; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; animation-delay: -1.7s; }
    @keyframes bob { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2deg) translateY(-2px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { .bob, .blink { animation: none; } }
